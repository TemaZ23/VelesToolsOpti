name: freelance-agent

on:
  push:
    branches:
      - main
    paths:
      - "freelance_agent/**"
      - ".github/workflows/freelance-agent.yml"
  pull_request:
    paths:
      - "freelance_agent/**"
      - ".github/workflows/freelance-agent.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: freelance_agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit and end-to-end tests
        run: pytest -m "not live"
